name: Probe Live RFQ After Production Merge

on:
  push:
    branches: [main]

jobs:
  probe:
    if: github.event.head_commit.message == 'Probe live RFQ after production merge'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production deployment and verify localized routes
        run: |
          BASE='https://sisteasv.com'
          for attempt in $(seq 1 24); do
            ok=1
            for entry in 'de|Geräte und Ersatzteile' 'es|equipos y repuestos' 'en|equipment and spare parts'; do
              locale="${entry%%|*}"
              marker="${entry#*|}"
              url="$BASE/$locale/wholesale-rfq"
              code=$(curl -sS -o /tmp/body -w '%{http_code}' "$url")
              echo "attempt=$attempt locale=$locale HTTP=$code"
              if [ "$code" != "200" ] || ! grep -qi "$marker" /tmp/body; then ok=0; fi
            done
            if [ "$ok" = "1" ]; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: Verify production RFQ API method protection
        run: |
          code=$(curl -sS -o /tmp/api -w '%{http_code}' 'https://sisteasv.com/api/rfq')
          echo "GET /api/rfq HTTP $code"
          test "$code" = "405"
          grep -q 'method_not_allowed' /tmp/api
