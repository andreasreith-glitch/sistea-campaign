name: Probe RFQ Branch Preview

on:
  push:
    branches: [main]

jobs:
  probe:
    if: github.event.head_commit.message == 'Probe RFQ branch preview'
    runs-on: ubuntu-latest
    steps:
      - name: Verify RFQ preview routes
        run: |
          BASE='https://agent-wholesale-rfq-tool.sistea-digital-platform.pages.dev'
          for entry in 'de|Geräte und Ersatzteile' 'es|equipos y repuestos' 'en|equipment and spare parts'; do
            locale="${entry%%|*}"
            marker="${entry#*|}"
            url="$BASE/$locale/wholesale-rfq"
            code=$(curl -sS -o /tmp/body -w '%{http_code}' "$url")
            echo "$locale HTTP $code"
            test "$code" = "200"
            grep -qi "$marker" /tmp/body
          done
      - name: Verify RFQ API method protection
        run: |
          BASE='https://agent-wholesale-rfq-tool.sistea-digital-platform.pages.dev'
          code=$(curl -sS -o /tmp/api -w '%{http_code}' "$BASE/api/rfq")
          echo "GET /api/rfq HTTP $code"
          test "$code" = "405"
          grep -q 'method_not_allowed' /tmp/api
