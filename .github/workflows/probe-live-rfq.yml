name: Verify Live SISTEA RFQ

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  probe:
    if: github.event.head_commit.message == 'Verify live RFQ and record result'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for production deployment and verify localized routes
        run: |
          BASE='https://sisteasv.com'
          for attempt in $(seq 1 24); do
            ok=1
            for entry in 'de|Geräte und Ersatzteile' 'es|equipos y repuestos' 'en|equipment and spare parts'; do
              locale="${entry%%|*}"
              marker="${entry#*|}"
              url="$BASE/$locale/wholesale-rfq"
              code=$(curl -sS -o /tmp/body -w '%{http_code}' "$url")
              echo "attempt=$attempt locale=$locale HTTP=$code"
              if [ "$code" != "200" ] || ! grep -qi "$marker" /tmp/body; then ok=0; fi
            done
            if [ "$ok" = "1" ]; then break; fi
            if [ "$attempt" = "24" ]; then exit 1; fi
            sleep 10
          done
      - name: Verify production RFQ API method protection
        run: |
          code=$(curl -sS -o /tmp/api -w '%{http_code}' 'https://sisteasv.com/api/rfq')
          echo "GET /api/rfq HTTP $code"
          test "$code" = "405"
          grep -q 'method_not_allowed' /tmp/api
      - name: Record verified result
        run: |
          printf 'LIVE_RFQ_OK\nverified_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > live-rfq-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live-rfq-status.txt
          git commit -m 'Record live RFQ verification'
          git push
